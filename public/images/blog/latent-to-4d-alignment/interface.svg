<svg xmlns="http://www.w3.org/2000/svg" width="480" height="486" viewBox="0 0 480 486" role="img"><style>text{font-family:Lato,Arial,sans-serif;fill:#222;font-size:17px}.muted{fill:#555}.small{font-size:16px}.heading{font-size:20px;font-weight:700}</style><rect width="100%" height="100%" fill="white"/><text x="22" y="30" class="heading">One latent convention, two sources</text><text x="22" y="65">Observed-video mean / final generated z</text><rect x="22" y="86" width="436" height="72" fill="white" stroke="#a9b4be"/><text x="40" y="113" style="font-weight:700">Video VAE tensor</text><text x="40" y="139" class="small muted">Tᵥ × Hᵥ × Wᵥ × Cᵥ</text><path d="M240 160v17m-5-5 5 5 5-5" fill="none" stroke="#555" stroke-width="1.5"/><rect x="22" y="182" width="436" height="72" fill="#f4f7fa" stroke="#a9b4be"/><text x="40" y="209" style="font-weight:700">Fixed trilinear resampling</text><text x="40" y="235" class="small muted">Match time and spatial grid</text><path d="M240 256v17m-5-5 5 5 5-5" fill="none" stroke="#555" stroke-width="1.5"/><rect x="22" y="278" width="436" height="72" fill="#f4f7fa" stroke="#a9b4be"/><text x="40" y="305" style="font-weight:700">Learned 3D convolution</text><text x="40" y="331" class="small muted">Convert channels and local evidence</text><path d="M240 352v17m-5-5 5 5 5-5" fill="none" stroke="#555" stroke-width="1.5"/><rect x="22" y="374" width="436" height="72" fill="white" stroke="#a9b4be"/><text x="40" y="401" style="font-weight:700">Flatten spatial dimensions</text><text x="40" y="427" class="small muted">T × M × d geometry tokens</text><text x="22" y="477" class="small muted">Then: frame-wise + global refinement → 4D</text></svg>
