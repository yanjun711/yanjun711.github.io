<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="title desc">
<title id="title">Selective update still fills the entire depth prefix</title><desc id="desc">Cached codes 12, 33, 7, 80 are combined with mask 0, 1, 0, 1. Two replay operations and two generation operations yield 12, 35, 7, 81 before the action.</desc>
