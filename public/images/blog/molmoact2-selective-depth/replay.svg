<g font-family="Lato,Arial,sans-serif" font-size="18" fill="#222"><text x="28" y="30">Cached depth</text><text x="272" y="30">Update mask</text></g>
<g stroke="#bbb" fill="#f6f6f6"><path d="M28 46h150v132H28Z"/><path d="M272 46h150v132H272Z"/><path d="M103 46v132M28 112h150M347 46v132M272 112h150"/></g>
<g font-family="Lato,Arial,sans-serif" font-size="22" fill="#333" text-anchor="middle"><text x="65" y="87">12</text><text x="140" y="87">33</text><text x="65" y="153">7</text><text x="140" y="153">80</text><text x="309" y="87">0</text><text x="384" y="87" fill="#1772d0">1</text><text x="309" y="153">0</text><text x="384" y="153" fill="#1772d0">1</text></g>
<g font-family="Lato,Arial,sans-serif" font-size="18" fill="#222"><text x="28" y="218">Consume codes in raster order</text></g>
<g fill="#f5f5f5" stroke="#aaa"><rect x="28" y="238" width="90" height="76"/><rect x="248" y="238" width="90" height="76"/></g><g fill="#edf6ff" stroke="#1772d0"><rect x="138" y="238" width="90" height="76"/><rect x="358" y="238" width="94" height="76"/></g>
<g font-family="Lato,Arial,sans-serif" text-anchor="middle" font-size="17" fill="#333"><text x="73" y="263">replay</text><text x="183" y="263">generate</text><text x="293" y="263">replay</text><text x="405" y="263">generate</text><text x="73" y="297" font-size="22">12</text><text x="183" y="297" font-size="22">35</text><text x="293" y="297" font-size="22">7</text><text x="405" y="297" font-size="22">81</text></g>
<path d="M118 276h18M228 276h18M338 276h18" stroke="#777" stroke-width="2"/>
<g font-family="Lato,Arial,sans-serif" font-size="18" fill="#222"><text x="28" y="356">2 new predictions; 4 consumed codes</text><text x="28" y="393" fill="#1772d0">Filled depth prefix → action</text><text x="28" y="422" fill="#666" font-size="16">Teaching grid: 2×2. Actual grid: 10×10.</text></g>
