<rect x="336.0" y="34" width="32" height="25" stroke="#777777" fill="white" stroke-width="1"/>
<text x="352.0" y="52" font-size="15" fill="#282828" text-anchor="middle">zᵐ</text>
<path d="M310 64V76H166V93" fill="none" stroke="#282828" stroke-width="1.15" marker-end="url(#arrow-ink)"/>
<path d="M310 76H466V93" fill="none" stroke="#282828" stroke-width="1.15" marker-end="url(#arrow-ink)"/>
<text x="18" y="112" font-size="13" fill="#777777" text-anchor="start">old prompt</text>
<path d="M85 107H96" fill="none" stroke="#777777" stroke-width="1.15" marker-end="url(#arrow-gray)"/>
<text x="166" y="112" font-size="14" fill="#282828" text-anchor="middle">text cross-attention</text>
<text x="317" y="112" font-size="13" fill="#526b78" text-anchor="start">new prompt</text>
<path d="M390 107H400" fill="none" stroke="#526b78" stroke-width="1.15" marker-end="url(#arrow-accent)"/>
<text x="466" y="112" font-size="14" fill="#282828" text-anchor="middle">text cross-attention</text>
<path d="M166 123V143" fill="none" stroke="#777777" stroke-width="1.15" marker-end="url(#arrow-gray)"/>
<text x="166" y="160" font-size="14" fill="#282828" text-anchor="middle">later video self-attn</text>
<path d="M166 171V191" fill="none" stroke="#777777" stroke-width="1.15" marker-end="url(#arrow-gray)"/>
<path d="M466 123V143" fill="none" stroke="#526b78" stroke-width="1.15" marker-end="url(#arrow-accent)"/>
