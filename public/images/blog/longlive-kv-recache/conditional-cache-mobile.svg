<svg xmlns="http://www.w3.org/2000/svg" width="360" height="310" viewBox="0 0 360 310" role="img" aria-labelledby="title desc">
<title id="title">Re-encode the same visual prefix under the new prompt</title>
<desc id="desc">The same generated video prefix enters two encodings. Old-prompt cross-attention produces stale downstream video keys and values. New-prompt cross-attention requires recomputing those downstream keys and values before continuing. The visual prefix itself remains unchanged.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs>
<marker id="arrow-ink" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L5 3L1 5" fill="none" stroke="#282828" stroke-width="1"/></marker>
<marker id="arrow-gray" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L5 3L1 5" fill="none" stroke="#777777" stroke-width="1"/></marker>
<marker id="arrow-accent" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L5 3L1 5" fill="none" stroke="#526b78" stroke-width="1"/></marker>
</defs>
