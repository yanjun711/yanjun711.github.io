<rect x="203.0" y="35" width="30" height="25" stroke="#777777" fill="white" stroke-width="1"/>
<text x="218.0" y="53" font-size="15" fill="#282828" text-anchor="middle">zᵐ</text>
<path d="M180 66V75H149V132H139" fill="none" stroke="#282828" stroke-width="1.15" marker-end="url(#arrow-ink)"/>
<path d="M180 75H211V132H221" fill="none" stroke="#282828" stroke-width="1.15" marker-end="url(#arrow-ink)"/>
<text x="88" y="96" font-size="14" fill="#777777" text-anchor="middle">old prompt</text>
<text x="272" y="96" font-size="14" fill="#526b78" text-anchor="middle">new prompt</text>
<path d="M88 104V114" fill="none" stroke="#777777" stroke-width="1.15" marker-end="url(#arrow-gray)"/>
