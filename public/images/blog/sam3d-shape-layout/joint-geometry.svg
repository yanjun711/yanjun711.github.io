<svg xmlns="http://www.w3.org/2000/svg" width="540" height="530" viewBox="0 0 540 530" font-family="Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#6d7780"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#6d7780"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="270" y="30" text-anchor="middle" font-size="21" fill="#272727" font-weight="bold">One object, two kinds of evidence</text><rect x="25" y="52" width="230" height="75" fill="#f6f7f8" stroke="#c6cbd0" rx="5"/><rect x="285" y="52" width="230" height="75" fill="#f6f7f8" stroke="#c6cbd0" rx="5"/><text x="140" y="82" text-anchor="middle" font-size="19" fill="#272727" font-weight="normal">Object crop + mask</text><text x="140" y="109" text-anchor="middle" font-size="16" fill="#666666" font-weight="normal">Focused object detail</text><text x="400" y="82" text-anchor="middle" font-size="19" fill="#272727" font-weight="normal">Full image + mask</text><text x="400" y="109" text-anchor="middle" font-size="16" fill="#666666" font-weight="normal">Scene context</text><path d="M140 128 L140 175" stroke="#6d7780" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><path d="M400 128 L400 175" stroke="#6d7780" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="25" y="176" width="490" height="200" fill="#f8fafb" stroke="#c6cbd0" rx="5"/><text x="270" y="207" text-anchor="middle" font-size="20" fill="#272727" font-weight="bold">Joint geometry denoising</text><rect x="43" y="232" width="207" height="116" fill="#eaf2f7" stroke="#aac0d1" rx="5"/><text x="146" y="263" text-anchor="middle" font-size="19" fill="#272727" font-weight="normal">Shape stream</text><text x="146" y="294" text-anchor="middle" font-size="18" fill="#272727" font-weight="normal">4,096 tokens</text><text x="146" y="323" text-anchor="middle" font-size="17" fill="#555555" font-weight="normal">16 × 16 × 16</text><rect x="291" y="232" width="207" height="116" fill="#f1f1ed" stroke="#c6c6b8" rx="5"/><text x="395" y="263" text-anchor="middle" font-size="19" fill="#272727" font-weight="normal">Layout stream</text><text x="395" y="294" text-anchor="middle" font-size="22" fill="#272727" font-weight="normal">R       t       s</text><text x="395" y="323" text-anchor="middle" font-size="17" fill="#555555" font-weight="normal">One token each</text><path d="M253 288 L287 288" stroke="#6d7780" stroke-width="1.8" fill="none" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M145 377 L145 422" stroke="#6d7780" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><path d="M395 377 L395 422" stroke="#6d7780" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="40" y="423" width="460" height="77" fill="#f6f7f8" stroke="#c6cbd0" rx="5"/><text x="270" y="451" text-anchor="middle" font-size="19" fill="#272727" font-weight="normal">Shape + placement in camera space</text><text x="270" y="481" text-anchor="middle" font-size="17" fill="#272727" font-weight="normal">p_camera = R diag(s) p_object + t</text></svg>
