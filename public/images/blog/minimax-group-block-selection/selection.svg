<svg xmlns="http://www.w3.org/2000/svg" width="620" height="260" viewBox="0 0 620 260" role="img" aria-labelledby="title desc">
<title id="title">Group-specific selected token support</title>
<desc id="desc">Eight visible tokens form four blocks. Group one selects tokens one, two, seven, and eight. Group two selects tokens three, four, seven, and eight. Block four is local and uses one of the two available slots. Heads in each group share this support but have separate attention weights. The indexer scores all visible tokens before selection.</desc>
<rect width="620" height="260" fill="white"/>
<g font-family="Lato,Arial,sans-serif">
<text x="20" y="22" font-size="14" fill="#282828" text-anchor="start" font-weight="bold">Main-attention support at query token 8</text>
<text x="20" y="48" font-size="13" fill="#777" text-anchor="start" font-weight="normal">Block</text>
<text x="20" y="74" font-size="13" fill="#777" text-anchor="start" font-weight="normal">Token</text>
<text x="188" y="48" font-size="13" fill="#777" text-anchor="middle" font-weight="normal">1</text>
<line x1="135" y1="55" x2="241" y2="55" stroke="#d8d8d8" stroke-width="1"/>
<text x="300" y="48" font-size="13" fill="#777" text-anchor="middle" font-weight="normal">2</text>
<line x1="247" y1="55" x2="353" y2="55" stroke="#d8d8d8" stroke-width="1"/>
<text x="412" y="48" font-size="13" fill="#777" text-anchor="middle" font-weight="normal">3</text>
<line x1="359" y1="55" x2="465" y2="55" stroke="#d8d8d8" stroke-width="1"/>
<text x="524" y="48" font-size="13" fill="#777" text-anchor="middle" font-weight="normal">4 · local</text>
<line x1="471" y1="55" x2="577" y2="55" stroke="#d8d8d8" stroke-width="1"/>
<text x="160.0" y="74" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">1</text>
<text x="216.0" y="74" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">2</text>
<text x="272.0" y="74" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">3</text>
<text x="328.0" y="74" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">4</text>
<text x="384.0" y="74" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">5</text>
<text x="440.0" y="74" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">6</text>
<text x="496.0" y="74" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">7</text>
<text x="552.0" y="74" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">8</text>
<text x="20" y="110" font-size="14" fill="#282828" text-anchor="start" font-weight="normal">Group 1</text>
<rect x="132" y="90" width="112" height="30" fill="#526b78" fill-opacity="0.15"/>
<circle cx="160.0" cy="105" r="4" fill="#526b78"/>
<circle cx="216.0" cy="105" r="4" fill="#526b78"/>
<text x="272.0" y="110" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<text x="328.0" y="110" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<text x="384.0" y="110" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<text x="440.0" y="110" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<rect x="468" y="90" width="112" height="30" fill="#d8d8d8" fill-opacity="0.55"/>
<circle cx="496.0" cy="105" r="4" fill="#777"/>
<circle cx="552.0" cy="105" r="4" fill="#777"/>
<line x1="132" y1="120" x2="580" y2="120" stroke="#d8d8d8" stroke-width="1"/>
<line x1="244" y1="90" x2="244" y2="120" stroke="#d8d8d8" stroke-width="1"/>
<line x1="356" y1="90" x2="356" y2="120" stroke="#d8d8d8" stroke-width="1"/>
<line x1="468" y1="90" x2="468" y2="120" stroke="#d8d8d8" stroke-width="1"/>
<text x="20" y="154" font-size="14" fill="#282828" text-anchor="start" font-weight="normal">Group 2</text>
<text x="160.0" y="154" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<text x="216.0" y="154" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<rect x="244" y="134" width="112" height="30" fill="#526b78" fill-opacity="0.15"/>
<circle cx="272.0" cy="149" r="4" fill="#526b78"/>
<circle cx="328.0" cy="149" r="4" fill="#526b78"/>
<text x="384.0" y="154" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<text x="440.0" y="154" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<rect x="468" y="134" width="112" height="30" fill="#d8d8d8" fill-opacity="0.55"/>
<circle cx="496.0" cy="149" r="4" fill="#777"/>
<circle cx="552.0" cy="149" r="4" fill="#777"/>
<line x1="132" y1="164" x2="580" y2="164" stroke="#d8d8d8" stroke-width="1"/>
<line x1="244" y1="134" x2="244" y2="164" stroke="#d8d8d8" stroke-width="1"/>
<line x1="356" y1="134" x2="356" y2="164" stroke="#d8d8d8" stroke-width="1"/>
<line x1="468" y1="134" x2="468" y2="164" stroke="#d8d8d8" stroke-width="1"/>
<rect x="20" y="180" width="12" height="12" fill="#526b78" fill-opacity=".15"/>
<text x="39" y="190" font-size="13" fill="#777" text-anchor="start" font-weight="normal">Selected nonlocal</text>
<rect x="220" y="180" width="12" height="12" fill="#d8d8d8" fill-opacity=".55"/>
<text x="239" y="190" font-size="13" fill="#777" text-anchor="start" font-weight="normal">Reserved local</text>
<text x="20" y="220" font-size="13" fill="#282828" text-anchor="start" font-weight="normal">Each group uses 2 blocks: one selected nonlocal block and one local block.</text>
<text x="20" y="245" font-size="13" fill="#777" text-anchor="start" font-weight="normal">Heads share support, not weights. The indexer scores all visible tokens first.</text>
</g>
</svg>
