<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-labelledby="title desc">
<title id="title">Group-specific selected token support</title>
<desc id="desc">Eight visible tokens form four blocks. Group one selects tokens one, two, seven, and eight. Group two selects tokens three, four, seven, and eight. Block four is local and uses one of the two available slots. Heads in each group share this support but have separate attention weights. The indexer scores all visible tokens before selection.</desc>
<rect width="360" height="300" fill="white"/>
<g font-family="Lato,Arial,sans-serif">
<text x="16" y="22" font-size="14" fill="#282828" text-anchor="start" font-weight="bold">Main-attention support at query token 8</text>
<text x="16" y="64" font-size="13" fill="#777" text-anchor="start" font-weight="normal">Block</text>
<text x="16" y="96" font-size="13" fill="#777" text-anchor="start" font-weight="normal">Token</text>
<text x="116" y="64" font-size="13" fill="#777" text-anchor="middle" font-weight="normal">1</text>
<line x1="87" y1="71" x2="145" y2="71" stroke="#d8d8d8" stroke-width="1"/>
<text x="180" y="64" font-size="13" fill="#777" text-anchor="middle" font-weight="normal">2</text>
<line x1="151" y1="71" x2="209" y2="71" stroke="#d8d8d8" stroke-width="1"/>
<text x="244" y="64" font-size="13" fill="#777" text-anchor="middle" font-weight="normal">3</text>
<line x1="215" y1="71" x2="273" y2="71" stroke="#d8d8d8" stroke-width="1"/>
<text x="308" y="64" font-size="13" fill="#777" text-anchor="middle" font-weight="normal">4 · local</text>
<line x1="279" y1="71" x2="337" y2="71" stroke="#d8d8d8" stroke-width="1"/>
<text x="100.0" y="96" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">1</text>
<text x="132.0" y="96" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">2</text>
<text x="164.0" y="96" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">3</text>
<text x="196.0" y="96" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">4</text>
<text x="228.0" y="96" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">5</text>
<text x="260.0" y="96" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">6</text>
<text x="292.0" y="96" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">7</text>
<text x="324.0" y="96" font-size="14" fill="#282828" text-anchor="middle" font-weight="normal">8</text>
<text x="16" y="132" font-size="14" fill="#282828" text-anchor="start" font-weight="normal">Group 1</text>
<rect x="84" y="112" width="64" height="30" fill="#526b78" fill-opacity="0.15"/>
<circle cx="100.0" cy="127" r="4" fill="#526b78"/>
<circle cx="132.0" cy="127" r="4" fill="#526b78"/>
<text x="164.0" y="132" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<text x="196.0" y="132" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<text x="228.0" y="132" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<text x="260.0" y="132" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<rect x="276" y="112" width="64" height="30" fill="#d8d8d8" fill-opacity="0.55"/>
<circle cx="292.0" cy="127" r="4" fill="#777"/>
<circle cx="324.0" cy="127" r="4" fill="#777"/>
<line x1="84" y1="142" x2="340" y2="142" stroke="#d8d8d8" stroke-width="1"/>
<line x1="148" y1="112" x2="148" y2="142" stroke="#d8d8d8" stroke-width="1"/>
<line x1="212" y1="112" x2="212" y2="142" stroke="#d8d8d8" stroke-width="1"/>
<line x1="276" y1="112" x2="276" y2="142" stroke="#d8d8d8" stroke-width="1"/>
<text x="16" y="176" font-size="14" fill="#282828" text-anchor="start" font-weight="normal">Group 2</text>
<text x="100.0" y="176" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<text x="132.0" y="176" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<rect x="148" y="156" width="64" height="30" fill="#526b78" fill-opacity="0.15"/>
<circle cx="164.0" cy="171" r="4" fill="#526b78"/>
<circle cx="196.0" cy="171" r="4" fill="#526b78"/>
<text x="228.0" y="176" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<text x="260.0" y="176" font-size="14" fill="#d8d8d8" text-anchor="middle" font-weight="normal">–</text>
<rect x="276" y="156" width="64" height="30" fill="#d8d8d8" fill-opacity="0.55"/>
<circle cx="292.0" cy="171" r="4" fill="#777"/>
<circle cx="324.0" cy="171" r="4" fill="#777"/>
<line x1="84" y1="186" x2="340" y2="186" stroke="#d8d8d8" stroke-width="1"/>
<line x1="148" y1="156" x2="148" y2="186" stroke="#d8d8d8" stroke-width="1"/>
<line x1="212" y1="156" x2="212" y2="186" stroke="#d8d8d8" stroke-width="1"/>
<line x1="276" y1="156" x2="276" y2="186" stroke="#d8d8d8" stroke-width="1"/>
<rect x="16" y="201" width="12" height="12" fill="#526b78" fill-opacity=".15"/>
<text x="35" y="211" font-size="13" fill="#777" text-anchor="start" font-weight="normal">Selected nonlocal</text>
<rect x="188" y="201" width="12" height="12" fill="#d8d8d8" fill-opacity=".55"/>
<text x="207" y="211" font-size="13" fill="#777" text-anchor="start" font-weight="normal">Reserved local</text>
<text x="16" y="240" font-size="13" fill="#282828" text-anchor="start" font-weight="normal">Budget: 1 nonlocal + 1 local = 2 blocks</text>
<text x="16" y="263" font-size="13" fill="#282828" text-anchor="start" font-weight="normal">Heads in a group share support, not weights.</text>
<text x="16" y="286" font-size="13" fill="#777" text-anchor="start" font-weight="normal">Indexer scores all visible tokens first.</text>
</g>
</svg>
