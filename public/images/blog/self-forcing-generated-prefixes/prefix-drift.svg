<svg xmlns="http://www.w3.org/2000/svg" width="620" height="260" viewBox="0 0 620 260" role="img" aria-labelledby="title desc">
<title id="title">Generated context with a detached KV cache</title>
<desc id="desc">Previous generated frames are encoded without gradients into a KV prefix. The selected denoising call reads this prefix and produces the current frame. Gradients reach the selected call but stop before entering the cached prefix.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs>
<marker id="arrow-ink" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L5 3L1 5" fill="none" stroke="#282828" stroke-width="1"/></marker>
<marker id="arrow-gray" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L5 3L1 5" fill="none" stroke="#777777" stroke-width="1"/></marker>
<marker id="arrow-accent" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L5 3L1 5" fill="none" stroke="#526b78" stroke-width="1"/></marker>
</defs>
<g font-family="Lato, Arial, sans-serif" fill="#282828" stroke-linecap="round" stroke-linejoin="round">
<text x="128" y="23" font-size="15" fill="#282828" text-anchor="middle" font-weight="400">Generated prefix</text>
<text x="440" y="23" font-size="15" fill="#282828" text-anchor="middle" font-weight="400">Current frame</text>
<rect x="29" y="43" width="36" height="29" stroke="#777777" fill="white" stroke-width="1"/>
<text x="47.0" y="63" font-size="15" fill="#282828" text-anchor="middle" font-weight="400">x¹</text>
<rect x="77" y="43" width="36" height="29" stroke="#777777" fill="white" stroke-width="1"/>
<text x="95.0" y="63" font-size="15" fill="#282828" text-anchor="middle" font-weight="400">x²</text>
<text x="143.0" y="63" font-size="15" fill="#282828" text-anchor="middle" font-weight="400">…</text>
<rect x="173" y="43" width="36" height="29" stroke="#777777" fill="white" stroke-width="1"/>
<text x="191.0" y="63" font-size="15" fill="#282828" text-anchor="middle" font-weight="400">xⁱ⁻¹</text>
<path d="M128 79V122" fill="none" stroke="#777777" stroke-width="1.15" marker-end="url(#arrow-gray)"/>
<text x="143" y="105" font-size="13" fill="#777777" text-anchor="start" font-weight="400">encode (no grad)</text>
<text x="52" y="144" font-size="13" fill="#777777" text-anchor="middle" font-weight="400">K</text>
<text x="52" y="164" font-size="13" fill="#777777" text-anchor="middle" font-weight="400">V</text>
<rect x="64.0" y="132" width="30.0" height="13" stroke="#d8d8d8" fill="white" stroke-width="1"/>
<rect x="98.0" y="132" width="30.0" height="13" stroke="#d8d8d8" fill="white" stroke-width="1"/>
<rect x="132.0" y="132" width="30.0" height="13" stroke="#d8d8d8" fill="white" stroke-width="1"/>
<rect x="166.0" y="132" width="30.0" height="13" stroke="#d8d8d8" fill="white" stroke-width="1"/>
<rect x="64.0" y="152" width="30.0" height="13" stroke="#d8d8d8" fill="white" stroke-width="1"/>
<rect x="98.0" y="152" width="30.0" height="13" stroke="#d8d8d8" fill="white" stroke-width="1"/>
<rect x="132.0" y="152" width="30.0" height="13" stroke="#d8d8d8" fill="white" stroke-width="1"/>
<rect x="166.0" y="152" width="30.0" height="13" stroke="#d8d8d8" fill="white" stroke-width="1"/>
<text x="130" y="191" font-size="13" fill="#777777" text-anchor="middle" font-weight="400">detached KV prefix</text>
<text x="440" y="66" font-size="16" fill="#282828" text-anchor="middle" font-weight="400">noisy xⁱ at tₛ</text>
<path d="M440 77V123" fill="none" stroke="#282828" stroke-width="1.15" marker-end="url(#arrow-ink)"/>
<text x="440" y="155" font-size="24" fill="#526b78" text-anchor="middle" font-weight="400">Gθ</text>
<text x="490" y="154" font-size="13" fill="#526b78" text-anchor="start" font-weight="400">gradients on</text>
<text x="490" y="177" font-size="13" fill="#777777" text-anchor="start" font-weight="400">selected call</text>
<path d="M202 147H402" fill="none" stroke="#282828" stroke-width="1.15" marker-end="url(#arrow-ink)"/>
<text x="304" y="132" font-size="13" fill="#777777" text-anchor="middle" font-weight="400">conditions frame i</text>
<path d="M403 168H239" fill="none" stroke="#526b78" stroke-width="1.15" marker-end="url(#arrow-accent)" stroke-dasharray="4 4"/>
<path d="M232 161V176" fill="none" stroke="#526b78" stroke-width="1.15"/>
<text x="313" y="192" font-size="13" fill="#526b78" text-anchor="middle" font-weight="400">no gradient into KV</text>
<path d="M440 188V209" fill="none" stroke="#282828" stroke-width="1.15" marker-end="url(#arrow-ink)"/>
<rect x="419" y="216" width="42" height="30" stroke="#777777" fill="white" stroke-width="1"/>
<text x="440" y="237" font-size="17" fill="#282828" text-anchor="middle" font-weight="400">x̂ⁱ₀</text>
<text x="473" y="236" font-size="13" fill="#777777" text-anchor="start" font-weight="400">generated output</text>
<text x="18" y="232" font-size="13" fill="#777777" text-anchor="start" font-weight="400">Earlier outputs keep their own loss paths.</text>
</g>
</svg>
