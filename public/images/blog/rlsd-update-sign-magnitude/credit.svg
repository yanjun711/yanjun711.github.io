<svg xmlns="http://www.w3.org/2000/svg" width="480" height="342" viewBox="0 0 480 342" role="img" aria-labelledby="title desc">
<title id="title">Evidence changes magnitude while preserving advantage sign</title><desc id="desc">Three token evidence ratios are two, one half, and one. For a positive response, the final advantages are 1.1, 0.9, 1. For a negative response they are -0.9, -1.1, -1.</desc>
<rect width="480" height="342" fill="white"/>
<g font-family="Lato,Arial,sans-serif" fill="#222" font-size="18"><text x="24" y="30">Teacher / student evidence</text><text x="88" y="65">2</text><text x="235" y="65">0.5</text><text x="388" y="65">1</text><text x="24" y="104">Positive response: A = +1</text><text x="24" y="220">Negative response: A = −1</text></g>
<path d="M44 178H436M44 244H436" stroke="#999"/>
<g fill="#1772d0"><rect x="70" y="123" width="56" height="55"/><rect x="212" y="133" width="56" height="45"/><rect x="354" y="128" width="56" height="50"/></g>
<g fill="#717171"><rect x="70" y="244" width="56" height="45"/><rect x="212" y="244" width="56" height="55"/><rect x="354" y="244" width="56" height="50"/></g>
<g font-family="Lato,Arial,sans-serif" text-anchor="middle" font-size="18"><g fill="white"><text x="98" y="159">+1.1</text><text x="240" y="161">+0.9</text><text x="382" y="160">+1.0</text><text x="98" y="274">−0.9</text><text x="240" y="278">−1.1</text><text x="382" y="276">−1.0</text></g><g fill="#555"><text x="98" y="328">Token 1</text><text x="240" y="328">Token 2</text><text x="382" y="328">Token 3</text></g></g>
</svg>
