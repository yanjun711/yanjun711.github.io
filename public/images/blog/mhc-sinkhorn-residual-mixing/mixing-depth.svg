<svg xmlns="http://www.w3.org/2000/svg" width="620" height="238" viewBox="0 0 620 238" font-family="Lato, Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">Doubly stochastic mixing of two residual streams</title><desc id="desc">Every row and column of the matrix sums to one. The shared vector (1,1) is unchanged; (1,-1) becomes (one half, minus one half). The equations show exact action on these two modes.</desc><rect width="100%" height="100%" fill="white"/><text x="12" y="23" font-size="14" text-anchor="start" fill="#282828" font-weight="bold">Nonnegative mixing matrix</text><text x="267" y="55" font-size="13" text-anchor="middle" fill="#777777" font-weight="normal">Row sum</text><text x="12" y="128" font-size="19" text-anchor="start" fill="#282828" font-weight="normal">B =</text><line x1="64" y1="66" x2="64" y2="168" stroke="#282828" stroke-width="1" /><line x1="64" y1="66" x2="71" y2="66" stroke="#282828" stroke-width="1" /><line x1="64" y1="168" x2="71" y2="168" stroke="#282828" stroke-width="1" /><line x1="215" y1="66" x2="215" y2="168" stroke="#282828" stroke-width="1" /><line x1="215" y1="66" x2="208" y2="66" stroke="#282828" stroke-width="1" /><line x1="215" y1="168" x2="208" y2="168" stroke="#282828" stroke-width="1" /><text x="103" y="102" font-size="21" text-anchor="middle" fill="#526b78" font-weight="normal">0.75</text><text x="177" y="102" font-size="21" text-anchor="middle" fill="#282828" font-weight="normal">0.25</text><line x1="228" y1="95" x2="251" y2="95" stroke="#d8d8d8" stroke-width="1" /><text x="267" y="102" font-size="17" text-anchor="middle" fill="#282828" font-weight="normal">1</text><text x="103" y="149" font-size="21" text-anchor="middle" fill="#282828" font-weight="normal">0.25</text><text x="177" y="149" font-size="21" text-anchor="middle" fill="#526b78" font-weight="normal">0.75</text><line x1="228" y1="142" x2="251" y2="142" stroke="#d8d8d8" stroke-width="1" /><text x="267" y="149" font-size="17" text-anchor="middle" fill="#282828" font-weight="normal">1</text><line x1="103" y1="174" x2="103" y2="181" stroke="#d8d8d8" stroke-width="1" /><text x="103" y="199" font-size="17" text-anchor="middle" fill="#282828" font-weight="normal">1</text><line x1="177" y1="174" x2="177" y2="181" stroke="#d8d8d8" stroke-width="1" /><text x="177" y="199" font-size="17" text-anchor="middle" fill="#282828" font-weight="normal">1</text><text x="140" y="224" font-size="13" text-anchor="middle" fill="#777777" font-weight="normal">Column sums</text><text x="330" y="23" font-size="14" text-anchor="start" fill="#282828" font-weight="bold">Action on two stream modes</text><text x="330" y="50" font-size="13" text-anchor="start" fill="#282828" font-weight="bold">Shared mode</text><text x="330" y="97" font-size="21" text-anchor="start" fill="#282828" font-weight="normal">B</text><line x1="366" y1="63" x2="366" y2="116" stroke="#282828" stroke-width="1" /><line x1="366" y1="63" x2="371" y2="63" stroke="#282828" stroke-width="1" /><line x1="366" y1="116" x2="371" y2="116" stroke="#282828" stroke-width="1" /><line x1="406" y1="63" x2="406" y2="116" stroke="#282828" stroke-width="1" /><line x1="406" y1="63" x2="401" y2="63" stroke="#282828" stroke-width="1" /><line x1="406" y1="116" x2="401" y2="116" stroke="#282828" stroke-width="1" /><text x="386" y="80" font-size="19" text-anchor="middle" fill="#526b78" font-weight="normal">1</text><text x="386" y="107" font-size="19" text-anchor="middle" fill="#526b78" font-weight="normal">1</text><text x="424" y="97" font-size="21" text-anchor="start" fill="#282828" font-weight="normal">=</text><line x1="451" y1="63" x2="451" y2="116" stroke="#282828" stroke-width="1" /><line x1="451" y1="63" x2="456" y2="63" stroke="#282828" stroke-width="1" /><line x1="451" y1="116" x2="456" y2="116" stroke="#282828" stroke-width="1" /><line x1="513" y1="63" x2="513" y2="116" stroke="#282828" stroke-width="1" /><line x1="513" y1="63" x2="508" y2="63" stroke="#282828" stroke-width="