<svg xmlns="http://www.w3.org/2000/svg" width="620" height="258" viewBox="0 0 620 258" font-family="Lato, Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">MOVA temporal-coordinate alignment</title><desc id="desc">At video rate two hertz and audio rate eight hertz, video index one and audio index four both occur at half a second. Native positions differ by three. Scaling the video position by four puts both at rotary position four.</desc><rect width="100%" height="100%" fill="white"/><text x="12" y="20" font-size="14" text-anchor="start" fill="#282828" font-weight="normal">One event at t = 0.5 s</text><text x="608" y="20" font-size="13" text-anchor="end" fill="#777777" font-weight="normal">Video 2 Hz · audio 8 Hz</text><text x="12" y="52" font-size="14" text-anchor="start" fill="#282828" font-weight="bold">Native indices</text><text x="12" y="100" font-size="13" text-anchor="start" fill="#282828" font-weight="normal">Video</text><line x1="82" y1="96" x2="294" y2="96" stroke="#d8d8d8" stroke-width="1" /><text x="12" y="154" font-size="13" text-anchor="start" fill="#282828" font-weight="normal">Audio</text><line x1="82" y1="150" x2="294" y2="150" stroke="#d8d8d8" stroke-width="1" /><line x1="108.5" y1="96" x2="188" y2="150" stroke="#526b78" stroke-width="1.1" stroke-dasharray="3 3"/><circle cx="82" cy="96" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="108.5" cy="96" r="4.6" fill="#526b78" stroke="#526b78" stroke-width="1"/><circle cx="135" cy="96" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="82" cy="150" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="108.5" cy="150" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="135" cy="150" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="161.5" cy="150" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="188" cy="150" r="4.6" fill="#526b78" stroke="#526b78" stroke-width="1"/><circle cx="214.5" cy="150" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="241" cy="150" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="267.5" cy="150" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="294" cy="150" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><text x="108.5" y="83" font-size="13" text-anchor="middle" fill="#526b78" font-weight="normal">i = 1; p = 1</text><text x="188" y="169" font-size="13" text-anchor="middle" fill="#526b78" font-weight="normal">j = 4; p = 4</text><line x1="82" y1="190" x2="294" y2="190" stroke="#777777" stroke-width="0.8" /><line x1="82" y1="190" x2="82" y2="194" stroke="#777777" stroke-width="0.8" /><text x="82" y="209" font-size="13" text-anchor="middle" fill="#777777" font-weight="normal">0</text><line x1="108.5" y1="190" x2="108.5" y2="194" stroke="#777777" stroke-width="0.8" /><text x="108.5" y="209" font-size="13" text-anchor="middle" fill="#777777" font-weight="normal">1</text><line x1="188" y1="190" x2="188" y2="194" stroke="#777777" stroke-width="0.8" /><text x="188" y="209" font-size="13" text-anchor="middle" fill="#777777" font-weight="normal">4</text><line x1="294" y1="190" x2="294" y2="194" stroke="#777777" stroke-width="0.8" /><text x="294" y="209" font-size="13" text-anchor="middle" fill="#777777" font-weight="normal">8</text><text x="69" y="209" font-size="13" text-anchor="end" fill="#777777" font-weight="normal">p</text><text x="188" y="235" font-size="13" text-anchor="middle" fill="#526b78" font-weight="normal">Δp = 3</text><text x="330" y="52" font-size="14" text-anchor="start" fill="#282828" font-weight="bold">Aligned positions</text><text x="330" y="100" font-size="13" text-anchor="start" fill="#282828" font-weight="normal">Video</text><line x1="400" y1="96" x2="612" y2="96" stroke="#d8d8d8" stroke-width="1" /><text x="330" y="154" font-size="13" text-anchor="start" fill="#282828" font-weight="normal">Audio</text><line x1="400" y1="150" x2="612" y2=