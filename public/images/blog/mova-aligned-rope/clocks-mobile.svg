<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" font-family="Lato, Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">MOVA temporal-coordinate alignment</title><desc id="desc">At video rate two hertz and audio rate eight hertz, video index one and audio index four both occur at half a second. Native positions differ by three. Scaling the video position by four puts both at rotary position four.</desc><rect width="100%" height="100%" fill="white"/><text x="12" y="17" font-size="13" text-anchor="start" fill="#282828" font-weight="normal">Video 2 Hz · audio 8 Hz · event at 0.5 s</text><text x="12" y="43" font-size="14" text-anchor="start" fill="#282828" font-weight="bold">Native indices</text><text x="343" y="43" font-size="13" text-anchor="end" fill="#526b78" font-weight="normal">Δp = 3</text><text x="12" y="83" font-size="13" text-anchor="start" fill="#282828" font-weight="normal">Video</text><line x1="82" y1="79" x2="343" y2="79" stroke="#d8d8d8" stroke-width="1" /><text x="12" y="115" font-size="13" text-anchor="start" fill="#282828" font-weight="normal">Audio</text><line x1="82" y1="111" x2="343" y2="111" stroke="#d8d8d8" stroke-width="1" /><line x1="114.625" y1="79" x2="212.5" y2="111" stroke="#526b78" stroke-width="1.1" stroke-dasharray="3 3"/><circle cx="82" cy="79" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="114.625" cy="79" r="4.6" fill="#526b78" stroke="#526b78" stroke-width="1"/><circle cx="147.25" cy="79" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="82" cy="111" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="114.625" cy="111" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="147.25" cy="111" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="179.875" cy="111" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="212.5" cy="111" r="4.6" fill="#526b78" stroke="#526b78" stroke-width="1"/><circle cx="245.125" cy="111" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="277.75" cy="111" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="310.375" cy="111" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="343" cy="111" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><text x="114.625" y="66" font-size="13" text-anchor="middle" fill="#526b78" font-weight="normal">i = 1; p = 1</text><text x="212.5" y="130" font-size="13" text-anchor="middle" fill="#526b78" font-weight="normal">j = 4; p = 4</text><line x1="82" y1="143" x2="343" y2="143" stroke="#777777" stroke-width="0.8" /><line x1="82" y1="143" x2="82" y2="147" stroke="#777777" stroke-width="0.8" /><text x="82" y="162" font-size="13" text-anchor="middle" fill="#777777" font-weight="normal">0</text><line x1="114.625" y1="143" x2="114.625" y2="147" stroke="#777777" stroke-width="0.8" /><text x="114.625" y="162" font-size="13" text-anchor="middle" fill="#777777" font-weight="normal">1</text><line x1="212.5" y1="143" x2="212.5" y2="147" stroke="#777777" stroke-width="0.8" /><text x="212.5" y="162" font-size="13" text-anchor="middle" fill="#777777" font-weight="normal">4</text><line x1="343" y1="143" x2="343" y2="147" stroke="#777777" stroke-width="0.8" /><text x="343" y="162" font-size="13" text-anchor="middle" fill="#777777" font-weight="normal">8</text><text x="69" y="162" font-size="13" text-anchor="end" fill="#777777" font-weight="normal">p</text><text x="12" y="175" font-size="14" text-anchor="start" fill="#282828" font-weight="bold">Aligned positions</text><text x="343" y="175" font-size="13" text-anchor="end" fill="#526b78" font-weight="normal">Δp = 0</text><text x="12" y="215" font-size="13" text-anchor="start" fill="#282828" font-weight="normal">Video</text><line x1="82" y1="211" x2="343" y2="211" stroke="#d8d8d8" stroke-width="1" /><text x="12" y="247" font-size="13" text-anchor="start" fill="#282828" font-weight="normal">Audio</text><line x1="82" y1="243" x2="343" y2="243" stroke="#d8d8d8" stroke-width="1" /><line x1="212.5" y1="211" x2="212.5" y2="243" stroke="#526b78" stroke-width="1.1" stroke-dasharray="3 3"/><circle cx="82" cy="211" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="212.5" cy="211" r="4.6" fill="#526b78" stroke="#526b78" stroke-width="1"/><circle cx="343" cy="211" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="82" cy="243" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="114.625" cy="243" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="147.25" cy="243" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="179.875" cy="243" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="212.5" cy="243" r="4.6" fill="#526b78" stroke="#526b78" stroke-width="1"/><circle cx="245.125" cy="243" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="277.75" cy="243" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="310.375" cy="243" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><circle cx="343" cy="243" r="2.5" fill="white" stroke="#777777" stroke-width="1"/><text x="212.5" y="198" font-size="13" text-anchor="middle" fill="#526b78" font-weight="normal">i = 1; p = 4</text><text x="212.5" y="262" font-size="13" text-anchor="middle" fill="#526b78" font-weight="normal">j = 4; p = 4</text><line x1="82" y1="275" x2="343" y2="275" stroke="#777777" stroke-width="0.8" /><line x1="82" y1="275" x2="82" y2="279" stroke="#777777" stroke-width="0.8" /><text x="82" y="294" font-size="13" text-anchor="middle" fill="#777777" font-weight="normal">0</text><line x1="114.625" y1="275" x2="114.625" y2="279" stroke="#777777" stroke-width="0.8" /><text x="114.625" y="294" font-size="13" text-anchor="middle" fill="#777777" font-weight="normal">1</text><line x1="212.5" y1="275" x2="212.5" y2="279" stroke="#777777" stroke-width="0.8" /><text x="212.5" y="294" font-size="13"